variables:
  VERSION: "1.4.3"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
- build
- release

.build:
  stage: build
  script:
    - cmake . --preset ${SYSTEM}-${ARCHITECTURE}-Release
    - cmake --build --preset ${SYSTEM}-${ARCHITECTURE}-Release
    - mv sq/ sq_code/
    - mv sq_compiler/ sq_compiler_code/
    - cp out/build/${SYSTEM}-${ARCHITECTURE}-Release/sq/sq${EXECUTABLE_SUFFIX} ./
    - cp out/build/${SYSTEM}-${ARCHITECTURE}-Release/sq_compiler/sq_compiler${EXECUTABLE_SUFFIX} ./
  artifacts:
    name: ${SYSTEM}-${ARCHITECTURE}
    paths:
      - sq${EXECUTABLE_SUFFIX}
      - sq_compiler${EXECUTABLE_SUFFIX}
    expire_in: never
    reports:
        dotenv: job.env


build:windows:
  extends: .build
  tags: [saas-windows-medium-amd64]
  variables:
    SYSTEM: "Windows"
    EXECUTABLE_SUFFIX: ".exe"
  before_script: |
    function loadenv($bat_file)
    {
      $env_file = New-TemporaryFile
      cmd /c " `"$bat_file`" $args && set > `"$env_file`" "

      foreach($line in Get-Content "$env_file") 
      {
        if($line -match "^(.*?)=(.*)$")
        {
          Set-Content "env:\$($matches[1])" $matches[2]
        }
      }

      Remove-Item "$env_file"
    }

    loadenv "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" ${ARCHITECTURE}
  after_script:
    - Add-Content -Path job.env -Value "${SYSTEM}_${ARCHITECTURE}_job_id=${CI_JOB_ID}"
  parallel:
    matrix:
      - ARCHITECTURE: [x86, x64]

build:linux:
  extends: .build
  image: registry.gitlab.com/gothicmultiplayerteam/buildimage:debian-bookworm-slim-${ARCHITECTURE}
  variables:
    SYSTEM: "Linux"
    EXECUTABLE_SUFFIX: ""
  after_script:
    - echo "${SYSTEM}_${ARCHITECTURE}_job_id=${CI_JOB_ID}" >> job.env
  parallel:
    matrix:
      - ARCHITECTURE: [x64, arm64]

build:wasm:
  stage: build
  image: emscripten/emsdk:latest
  script:
    - apt-get update
    - apt-get install -y ninja-build
    - cmake . --preset WebAssembly-Release
    - cmake --build --preset WebAssembly-Release
  artifacts:
    name: "sq_docs"
    paths:
      - doc/source/_static/sq_wasm.js
      - doc/source/_static/sq_wasm.wasm

build:docs:
  stage: build
  needs: [build:wasm]
  image: python:3.9-alpine
  script:
    - cd doc
    - pip install -r source/requirements.txt
    - sphinx-build -b html source ../sq_docs
  artifacts:
    name: "sq_docs"
    paths:
      - sq_docs/

pages:
  stage: build
  needs: [build:docs]
  script:
    - mv sq_docs public
  after_script:
    - 'echo "Online documentation available under: ${CI_PAGES_URL}"'
  artifacts:
    paths:
      - public

docs:
  stage: build
  needs: [build:docs]
  script:
    - echo "Docs_job_id=${CI_JOB_ID}" >> job.env
  artifacts:
    name: "sq_docs"
    paths:
      - sq_docs/
    expire_in: never
    reports:
       dotenv: job.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [pages, docs, build:windows, build:linux]
  script:
    - echo "Created ${VERSION} release"
  release:
    tag_name: "${VERSION}"
    description: "./CHANGELOG.md"
    assets:
      links:
        - name: "sq_docs"
          url: "${CI_PROJECT_URL}/-/jobs/${Docs_job_id}/artifacts/download"
        - name: "Windows-x86"
          url: "${CI_PROJECT_URL}/-/jobs/${Windows_x86_job_id}/artifacts/download"
          link_type: "package"
        - name: "Windows-x64"
          url: "${CI_PROJECT_URL}/-/jobs/${Windows_x64_job_id}/artifacts/download"
          link_type: "package"
        - name: "Linux-x64"
          url: "${CI_PROJECT_URL}/-/jobs/${Linux_x64_job_id}/artifacts/download"
          link_type: "package"
        - name: "Linux-arm64"
          url: "${CI_PROJECT_URL}/-/jobs/${Linux_arm64_job_id}/artifacts/download"
          link_type: "package"
